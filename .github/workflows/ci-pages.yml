name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Domain, world and save tests
        run: pnpm test
      - name: Build and package
        run: pnpm package
      - name: Verify committed game matches source
        run: git diff --exit-code -- dist/index.html 'start the game.html'
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chinese screenshot fonts
        run: sudo apt-get install -y fonts-noto-cjk
      - name: Browser regression
        run: pnpm test:browser
      - name: UI layout and screenshot review
        run: pnpm test:ui
      - name: Responsive title and motion regression
        run: pnpm test:title
      - name: Save reliability regression
        run: pnpm test:save-browser
      - name: Offline portable regression
        run: pnpm test:portable
      - name: Save diagnostic reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
